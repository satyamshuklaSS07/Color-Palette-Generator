<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Generate and copy random HEX color palettes.">
  <title>Color Palette Generator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="hero">
      <p class="eyebrow">Satyam Shukla</p>
      <h1>Color Palette Generator</h1>
      <p class="subtitle">Generate a fresh 5-color HEX palette and copy any color with one click.</p>
    </header>

    <section class="palette-card" aria-label="Generated color palette">
      <div id="palette" class="palette"></div>
      <button id="generateBtn" class="generate-btn" type="button">Generate New Palette</button>
      <p id="status" class="status" role="status" aria-live="polite"></p>
    </section>

    <footer>
      <span>HTML5</span>
      <span>CSS3</span>
      <span>JavaScript</span>
    </footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
